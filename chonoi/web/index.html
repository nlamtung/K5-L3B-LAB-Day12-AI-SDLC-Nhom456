<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Út Sen ở Rạch Sen</title>
<style>
  /* ================= Thiết kế: "Chợ nổi Rạch Sen" =================
     Sáng: sông phù sa, trời hồng bình minh, dừa nước, nhà sàn.
     Tối: nhà bè, đèn dây vàng, khói bếp. Chữ HUD ≥ 18px ở 1280×720 (TICKET-02). */
  :root {
    --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
    --ink: #fff7ec; --ink-dim: #e9d9c4; --ink-mute: #c9b49b;
    --glass: rgba(28, 18, 12, 0.62); --glass-strong: rgba(24, 14, 10, 0.86);
    --line: rgba(255, 214, 160, 0.28); --gold: #ffcf6e; --gold-deep: #e8a33d;
    --lotus: #ff8fb1; --leaf: #8fd17a; --river: #4fb3bf; --danger: #ff5a4e; --warn: #ffb347;
    --ok: #7ad97a; --purple: #b04dff; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --radius: 16px;
  }
  html, body { margin: 0; height: 100%; background: #120c09; color: var(--ink);
    font: 18px/1.35 var(--font); overflow: hidden; user-select: none; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .hidden { display: none !important; }

  /* ---------- lớp HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .panel { pointer-events: auto; }
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px;
    align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 18px;
    font-weight: 600; white-space: nowrap; }
  .chip b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .chip.time b { font-size: 26px; letter-spacing: .5px; }
  .chip.time.low { border-color: var(--danger); color: #ffd6d2; animation: pulse 0.8s infinite alternate; }
  .chip.phase { background: linear-gradient(135deg, rgba(232,163,61,.9), rgba(200,90,60,.9)); border: 0; color: #2a140a; }
  .spacer { flex: 1; }

  #left { position: absolute; top: 76px; left: 12px; width: 330px; padding: 14px 16px; }
  #left.gather { top: auto; bottom: 86px; }
  #right.gather { top: auto; bottom: 140px; }
  #left.shop { left: 50%; transform: translateX(-50%); width: min(820px, 92vw); }
  #left.shop .shopcards { grid-template-columns: 1fr 1fr !important; }
  #right { position: absolute; top: 76px; right: 12px; width: 360px; padding: 12px 14px; }
  #bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px;
    display: flex; align-items: center; gap: 14px; }
  .ttl { font-size: 18px; font-weight: 800; color: var(--gold); letter-spacing: .4px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 18px; }
  .lbl { color: var(--ink-dim); min-width: 74px; }
  .meter { position: relative; flex: 1; height: 22px; border-radius: 11px; background: rgba(0,0,0,.45);
    overflow: hidden; border: 1px solid rgba(255,255,255,.18); }
  .meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 11px; transition: width .12s linear; }
  .meter > span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px;
    font-weight: 700; text-shadow: 0 1px 2px #000; }
  .blink { animation: blink 0.5s steps(2, start) infinite; }
  .hearts { font-size: 22px; letter-spacing: 2px; }
  .need { display: flex; justify-content: space-between; padding: 4px 10px; border-radius: 10px;
    background: rgba(255,255,255,.06); margin: 4px 0; font-size: 18px; }
  .need.done { background: rgba(122,217,122,.18); color: #d8ffd2; }
  .slot { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.08);
    border: 1px dashed rgba(255,255,255,.22); position: relative; display: grid; place-items: center;
    font-size: 24px; flex: 0 0 auto; }
  .slot.full { border-style: solid; border-color: rgba(255,255,255,.35); }
  .slot .fr { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 5px; border-radius: 3px;
    background: rgba(0,0,0,.5); overflow: hidden; }
  .slot .fr > i { position: absolute; inset: 0 auto 0 0; }
  .slot.spoiled { filter: grayscale(.8) brightness(.7); }
  .slot.spoiled::after { content: "✕"; position: absolute; color: var(--danger); font-weight: 900; font-size: 26px; }
  .slots { display: flex; gap: 6px; flex-wrap: nowrap; }
  .holdcap { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .keys { margin-left: auto; font-size: 18px; color: var(--ink-dim); white-space: nowrap; }
  kbd { font: 700 16px var(--font); background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
    border-bottom-width: 3px; border-radius: 7px; padding: 1px 7px; color: var(--ink); }
  .stockchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; margin: 3px 4px 3px 0;
    border-radius: 999px; background: rgba(255,255,255,.08); font-size: 18px; }
  .stockchip .dot { width: 12px; height: 12px; border-radius: 50%; }
  .stockchip.bad { outline: 2px solid rgba(255,90,78,.6); }
  .card { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); margin: 6px 0; font-size: 18px; }
  .card.hot { background: linear-gradient(135deg, rgba(232,163,61,.35), rgba(255,90,78,.25)); }
  .card.ready { background: rgba(122,217,122,.2); animation: glow 1s infinite alternate; }
  .muted { color: var(--ink-mute); }

  .feed .item { font-size: 18px; padding: 5px 0; border-bottom: 1px dashed rgba(255,214,160,.14);
    animation: slidein .35s ease-out; }
  .feed .item:last-child { border-bottom: 0; }
  #hint { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); padding: 10px 20px;
    font-size: 20px; font-weight: 700; border-color: var(--gold); }
  #alerts { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); display: flex;
    flex-direction: column; gap: 8px; align-items: center; }
  .alert { padding: 10px 22px; border-radius: 999px; font-size: 20px; font-weight: 800; letter-spacing: .3px;
    box-shadow: var(--shadow); animation: pulse .5s infinite alternate; }
  .alert.monster { background: var(--purple); color: #fff; font-size: 26px; }
  .alert.oxy { background: var(--danger); color: #fff; }
  .alert.angry { background: #ff7043; color: #fff; }
  .alert.burn { background: #ff9800; color: #2a140a; }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    box-shadow: inset 0 0 0 10px var(--purple), inset 0 0 120px 40px rgba(176,77,255,.55); }
  #vignette.on { opacity: 1; animation: pulse .6s infinite alternate; }

  #kitchen { position: absolute; right: 12px; bottom: 140px; width: 380px; padding: 10px 12px 12px; }
  #kitchen canvas { width: 356px; height: 180px; border-radius: 12px; display: block; background: #2a1a12; }
  #k-line { margin-top: 8px; font-size: 18px; font-style: italic; color: #ffe9c7; min-height: 48px; }

  /* ---------- màn hình (menu, intro, kết quả, pause, shop) ---------- */
  #screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 30%, rgba(60,30,15,.55), rgba(8,5,3,.88)); pointer-events: auto; }
  .modal { width: min(760px, 92vw); max-height: 88vh; overflow: auto; padding: 30px 34px; border-radius: 24px;
    background: linear-gradient(160deg, rgba(58,34,20,.97), rgba(24,14,10,.97)); border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .35s cubic-bezier(.2,1.3,.4,1); }
  .modal h1 { margin: 0 0 6px; font-size: 46px; line-height: 1.1; color: var(--gold);
    text-shadow: 0 3px 0 #7a3d12, 0 8px 20px rgba(0,0,0,.6); }
  .modal h2 { margin: 0 0 14px; font-size: 26px; color: var(--ink-dim); font-weight: 600; }
  .modal p { font-size: 20px; margin: 10px 0; }
  .say { position: relative; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.07);
    border-left: 5px solid var(--lotus); font-size: 20px; font-style: italic; margin: 14px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .stat { padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.07); }
  .stat .k { font-size: 18px; color: var(--ink-dim); }
  .stat .v { font-size: 32px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  button.big { font: 800 22px var(--font); padding: 14px 28px; border-radius: 14px; cursor: pointer;
    border: 0; color: #2a140a; background: linear-gradient(180deg, #ffd98a, var(--gold-deep));
    box-shadow: 0 5px 0 #8a4a14, 0 10px 20px rgba(0,0,0,.35); transition: transform .08s; }
  button.big:hover { transform: translateY(-2px); }
  button.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a4a14; }
  button.big.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.5); }
  .autobar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 18px; overflow: hidden; }
  .autobar > i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
  .dish { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin: 6px 0;
    border-radius: 12px; background: rgba(255,255,255,.07); font-size: 20px; }
  .dish .q { font-weight: 800; color: var(--gold); }
  .shopcards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
  .up { padding: 18px; border-radius: 18px; background: rgba(255,255,255,.07); border: 2px solid transparent; }
  .up.can { border-color: var(--ok); }
  .up h3 { margin: 0 0 6px; font-size: 24px; }
  .pips { display: flex; gap: 6px; margin: 8px 0; }
  .pips i { width: 34px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); }
  .pips i.on { background: var(--gold); }
  .title-art { font-size: 64px; line-height: 1; margin-bottom: 8px; letter-spacing: 6px; }

  .topbtns { position: fixed; bottom: 86px; right: 12px; display: flex; gap: 8px; z-index: 5; }
  .top-btn { font: 700 18px var(--font); padding: 8px 14px; border-radius: 999px; cursor: pointer;
    color: var(--ink); background: var(--glass); border: 1px solid var(--line); }
  .top-btn:hover { border-color: var(--gold); }

  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes glow { from { box-shadow: 0 0 0 rgba(122,217,122,0); } to { box-shadow: 0 0 18px rgba(122,217,122,.7); } }
  @keyframes slidein { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---------- Tương phản cao (TV4, giữ nguyên chức năng) ---------- */
  body.high-contrast { --glass: #000; --glass-strong: #000; --line: #fff; --ink: #fff; --ink-dim: #fff;
    --ink-mute: #ffff00; --gold: #ffff00; --gold-deep: #ffff00; }
  body.high-contrast .panel, body.high-contrast .modal { background: #000; border: 2px solid #fff; backdrop-filter: none; }
  body.high-contrast .chip.phase { background: #ffff00; color: #000; }
  body.high-contrast button.big { background: #ffff00; color: #000; box-shadow: none; border: 3px solid #fff; }
  body.high-contrast .alert { border: 3px solid #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="topbar"></div>
  <div id="left" class="panel hidden"></div>
  <div id="right" class="panel feed hidden"></div>
  <div id="alerts"></div>
  <div id="hint" class="panel hidden"></div>
  <div id="kitchen" class="panel hidden">
    <div class="ttl">🔥 Bếp Út Sen <span id="k-dish" class="muted"></span></div>
    <canvas id="kc" width="712" height="360"></canvas>
    <div id="k-line"></div>
  </div>
  <div id="bottom" class="panel hidden"></div>
</div>
<div class="topbtns">
  <button id="contrast-btn" class="top-btn">👁 Tương phản cao: Tắt (H)</button>
  <button id="sound-btn" class="top-btn">🔊 Âm thanh: Bật</button>
</div>
<div id="screen" class="hidden"></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp — giao diện "Chợ nổi Rạch Sen" (Nhóm 456).
 * - Nền tảng TV4 (Presceltooo): Canvas 2D, hạt hiệu ứng, âm thanh Web Audio, Tương phản cao, 3 cảnh báo, Cá Sấu, độ tươi.
 * - TV1 (nlamtung): bộ ảnh 2D miền Tây (chonoi/web/assets/, tách nền trắng flood-fill) và menu chọn món tại bếp (POST /cook, chỉ live).
 * - Thiết kế lại (TV3, theo quyết định của TV3): HUD lớp HTML chữ ≥ 18px; menu chính, DayIntro, EveningIntro,
 *   DayResult, Summary, menu Pause (TICKET-02); gợi ý hái/cập bến, "Thủy quái!" + viền tím, "Hết hơi!";
 *   tiến độ bếp, kho khả dụng; khung "Bếp Út Sen" góc nhìn thứ nhất theo tiến độ nấu thật.
 * - Chỉ ĐỌC /state và gửi /input như cũ: không đổi luật, headless và Test Contract giữ nguyên.
 *   Màn hình giới thiệu/kết quả tạm dừng sim bằng nút pause chuẩn để người chơi không mất giờ.
 */
const $ = (id) => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const kcv = $("kc"), kctx = kcv.getContext("2d");
const params = new URLSearchParams(location.search);
let snap = null, offline = false;

// ================= dữ liệu hiển thị (chỉ là nhãn, không phải luật) =================
const KIND = {
  ca_loc: { name: "cá lóc", icon: "🐟", color: "#9bb86a" },
  ca_linh: { name: "cá linh", icon: "🐠", color: "#8fc3ff" },
  ca_keo: { name: "cá kèo", icon: "🐡", color: "#e3b07a" },
  bong_dien_dien: { name: "điên điển", icon: "🌼", color: "#ffd54f" },
  bong_sung: { name: "bông súng", icon: "🪷", color: "#ff8fb1" },
  keo_neo: { name: "kèo nèo", icon: "🌿", color: "#a5d67a" },
};
const DISH = {
  ca_loc_nuong_trui: { name: "Cá lóc nướng trui", short: "Cá lóc trui", icon: "🔥", style: "grill" },
  goi_bong_sung: { name: "Gỏi bông súng", short: "Gỏi súng", icon: "🥗", style: "salad" },
  lau_ca_linh_dien_dien: { name: "Lẩu cá linh điên điển", short: "Lẩu cá linh", icon: "🍲", style: "pot" },
  canh_chua_ca_loc: { name: "Canh chua cá lóc", short: "Canh chua", icon: "🥣", style: "pot" },
  ca_keo_nuong: { name: "Cá kèo nướng muối ớt", short: "Cá kèo nướng", icon: "🍢", style: "grill" },
  lau_mam: { name: "Lẩu mắm miền Tây", short: "Lẩu mắm", icon: "🍲", style: "pot" },
};
const kind = (k) => KIND[k] || { name: k, icon: "•", color: "#bbb" };
const dish = (d) => DISH[d] || { name: d, short: d, icon: "🍽", style: "pot" };
const itemKind = (it) => (typeof it === "string" ? it : it.kind);
const spoilBelow = () => (snap && snap.freshness && snap.freshness.spoiled_below) || 30;
const isSpoiled = (it) => typeof it === "object" && it.fresh < spoilBelow();
const freshColor = (f) => (f < spoilBelow() ? "#ff5a4e" : f < 60 ? "#ffb347" : "#7ad97a");
const TICK_HZ = 60;
const phaseOf = () => (snap ? snap.phase || snap.mode : "gather");
const isDay = () => snap && snap.mode === "day";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmtTime(ticks) { const s = Math.max(0, Math.ceil((ticks || 0) / TICK_HZ)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function counts(list) {
  const c = {};
  if (!list) return c;
  if (!Array.isArray(list)) { for (const k in list) c[k] = list[k]; return c; }
  list.forEach((it) => { const k = itemKind(it); c[k] = (c[k] || 0) + 1; });
  return c;
}
function usableCounts(list) { return counts(Array.isArray(list) ? list.filter((it) => !isSpoiled(it)) : list); }

// ================= Tương phản cao & âm thanh (TV4) =================
let highContrast = false;
function toggleHighContrast() {
  highContrast = !highContrast;
  document.body.classList.toggle("high-contrast", highContrast);
  $("contrast-btn").innerText = highContrast ? "👁 Tương phản cao: BẬT (H)" : "👁 Tương phản cao: Tắt (H)";
}
$("contrast-btn").addEventListener("click", toggleHighContrast);
let audioCtx = null, soundEnabled = true;
function initAudio() {
  if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function toggleSound() { initAudio(); soundEnabled = !soundEnabled; $("sound-btn").innerText = soundEnabled ? "🔊 Âm thanh: Bật" : "🔇 Âm thanh: Tắt"; }
$("sound-btn").addEventListener("click", toggleSound);
function tone(freq, type, dur, gain = 0.1, delay = 0) {
  if (!soundEnabled) return;
  setTimeout(() => {
    initAudio(); if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(gain, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }, delay);
}
const SFX = {
  splash: () => tone(180, "sine", 0.25, 0.15),
  ready: () => { tone(587.33, "triangle", 0.35, 0.12); tone(880, "sine", 0.4, 0.15, 120); },
  coin: () => { tone(987.77, "sine", 0.2, 0.15); tone(1318.51, "sine", 0.3, 0.18, 100); },
  hit: () => { tone(110, "sawtooth", 0.3, 0.18); tone(70, "square", 0.35, 0.12, 80); },
  buy: () => { tone(660, "triangle", 0.15, 0.12); tone(990, "triangle", 0.2, 0.12, 90); tone(1320, "sine", 0.3, 0.12, 180); },
  ui: () => tone(520, "sine", 0.08, 0.06),
};

// ================= input =================
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
function currentInput(extra = {}) {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phaseOf() === "quan") dy = -dy;                           // quan: lên (bắc) = z dương
  return Object.assign({ move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
    pause: down.has("pause"), shop_done: down.has("shop_done") }, extra);
}
function post(obj) { queue.push(JSON.stringify(obj)); flush(); }
function pushInput() { const s = JSON.stringify(currentInput()); if (s === lastSent) return; lastSent = s; queue.push(s); flush(); }
async function flush() {
  if (inflight) return; inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) {}
  }
  inflight = false;
}
function pulse(button) { post(currentInput({ [button]: true })); post(currentInput({ [button]: false })); lastSent = ""; }
function buy(id) { post(currentInput({ buy: id })); SFX.ui(); }
function nearestIdleStove() {
  // Bếp rảnh phải là đối tượng gần nhất trong bán kính (bàn/bếp khác gần hơn thì E tương tác như luật)
  if (!snap || phaseOf() !== "quan" || !snap.player || snap.hand) return null;
  const r = (snap.meta && snap.meta.interact_radius) || 1.5, p = snap.player.pos;
  let best = null, bd = Infinity;
  [...(snap.stoves || []).map((o) => ["stove", o]), ...(snap.tables || []).map((o) => ["table", o])].forEach(([k, o]) => {
    const d = Math.hypot(p[0] - o.pos[0], p[1] - o.pos[1]); if (d <= r && d < bd) { bd = d; best = [k, o]; } });
  return best && best[0] === "stove" && best[1].state === "idle" ? best[1] : null;
}
function reservedOrders() {
  // sắp như luật contract: đơn cũ nhất theo order_tick rồi id bàn -> Enter = nấu đúng đơn luật chọn
  return ((snap && snap.customers) || []).filter((c) => c.order_status === "reserved")

let cookStart = {};
function onEvent(ev) {
  const d = ev.data || {};
  switch (ev.name) {
    case "dish_ready": SFX.ready(); break;
    case "paid": SFX.coin(); break;
    case "dive": case "surface": SFX.splash(); break;
    case "monster_hit": case "choke": SFX.hit(); break;
    case "bought": SFX.buy(); break;
    case "cook_started": cookStart[d.stove_id] = ev.tick; break;
    case "served":
      stats.served[d.dish_id] = (stats.served[d.dish_id] || 0) + 1; stats.servedCount++; stats.tips += d.tip || 0;
      if (dayStats) { dayStats.served++; dayStats.tips += d.tip || 0; }
      break;
    case "customer_left": if (d.reason === "patience") { stats.left++; if (dayStats) dayStats.left++; } break;
    case "day_plan":
      dayStats = { day: ev.day, served: 0, left: 0, tips: 0, rep0: snap ? snap.reputation : 0, plan: d };
      queueScreen("dayIntro", { day: ev.day, plan: d });
      break;
    case "phase_start": if (ev.phase === "quan" && isDay()) queueScreen("evening", { day: ev.day }); break;
    case "quan_end": if (isDay()) queueScreen("dayResult", Object.assign({ day: ev.day }, d)); break;
  }
  const f = EVENT_TEXT[ev.name];
  if (f) { try { feed.push(f(d)); } catch (e) {} if (feed.length > 7) feed.shift(); }
}
function processEvents(events) {
  if (!events || !events.length) return;
  if (events[events.length - 1].tick < lastTick) { resetClient(); }  // server restart
  let idxAtTick = 0, prev = -1;
  for (const ev of events) {
    if (ev.tick !== prev) { idxAtTick = 0; prev = ev.tick; }
    idxAtTick++;
    if (ev.tick < lastTick) continue;
    if (ev.tick === lastTick && idxAtTick <= seenAtTick) continue;
    onEvent(ev);
    if (ev.tick !== lastTick) { lastTick = ev.tick; }
    seenAtTick = idxAtTick;
  }
}
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const first = !snap;
    snap = await r.json(); offline = false;
    if (first && scr.cur && scr.cur.type === "menu") showScreen("menu", scr.cur.data);
    processEvents(snap.events);
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}

  if (want && snap.state === "playing" && now - lastPulseAt > 300) { pulse("pause"); weHeld = true; lastPulseAt = now; }
  if (!want && weHeld && now - lastPulseAt > 300) {

  if (!cur && !weHeld && snap.state === "paused" && now - lastPulseAt > 300) showScreen("pause");
  if (cur === "pause" && snap.state !== "paused") closeScreen(true);
  if (cur === "cook") { const st = (snap.stoves || []).find((x) => x.id === scr.cur.data.stove); if (phaseOf() !== "quan" || !st || st.state !== "idle") closeScreen(true); }
  // Kết thúc
  if (snap.finished && !cur && !scr.queue.length) {
    if (isDay() && snap.reason === "days_complete") showScreen("summary");
    else if (!isDay()) showScreen("finished");
  }
  if (scr.dur && $("ab")) $("ab").style.transform = `scaleX(${Math.max(0, 1 - (now - scr.t0) / scr.dur)})`;
}

    const x = sx(P.pos[0]), y = sy(P.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,207,110,.5)"; ctx.setLineDash([5, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, meta.interact_radius * s, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    if (art("quan_props")) quad(ART.quan_props, 0, 0, x, y, 1.85 * s);
    else { ctx.fillStyle = "#5b3420"; ctx.beginPath(); ctx.arc(x, y, s * .5, 0, 7); ctx.fill();
      for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? "#111" : "#f5f0e6"; ctx.beginPath(); ctx.arc(x, y, s * .5, i * Math.PI / 6, (i + 1) * Math.PI / 6); ctx.lineTo(x, y); ctx.fill(); }
      ctx.fillStyle = "#1a0f0a"; ctx.beginPath(); ctx.arc(x, y, s * .32, 0, 7); ctx.fill(); }
    if (snap.hand) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + s * .5, y - s * .3, s * .28, 0, 7); ctx.fill(); label(dish(snap.hand.dish_id).icon, x + s * .5, y - s * .3, 20); }
  }
}
function drawShopBg(w, h) {
  cached("shop" + w + "x" + h + highContrast, w, h, (g) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, highContrast ? "#000" : "#2a1630"); gr.addColorStop(1, highContrast ? "#000" : "#120c09");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (!highContrast) for (let i = 0; i < 14; i++) { const x = (i + .5) * w / 14, y = 70 + (i % 3) * 18;
      const gl = g.createRadialGradient(x, y, 0, x, y, 60); gl.addColorStop(0, "rgba(255,120,60,.55)"); gl.addColorStop(1, "rgba(255,120,60,0)"); g.fillStyle = gl; g.fillRect(x - 60, y - 60, 120, 120);
      g.fillStyle = "#e8452c"; g.beginPath(); g.ellipse(x, y, 14, 18, 0, 0, 7); g.fill(); }
  });
}

// ================= khung "Bếp Út Sen" — góc nhìn thứ nhất theo tiến độ nấu thật =================
const KITCHEN_LINES = {
  grill: [[.15, "“Nướng trui là phải xiên cây tre, cắm đứng vầy nè.”"], [.65, "“Đốt rơm cho cháy rụi, thơm mùi đồng nghen!”"], [.9, "“Cháy đen bên ngoài là được rồi, đừng sợ.”"], [1, "“Cạo lớp cháy ra, thịt trắng phau, thơm phức luôn!”"]],
  salad: [[.3, "“Tước vỏ cho sạch, bẻ khúc cỡ lóng tay.”"], [.55, "“Ngâm chút xíu cho nó giòn rụm.”"], [.85, "“Trộn đều tay, đừng để dập nghen.”"], [1, "“Gỏi mát rượi nè!”"]],
  pot: [[.1, "“Bắc nồi đất lên bếp than cái đã.”"], [.35, "“Nêm chua chua ngọt ngọt mới đúng điệu.”"], [.6, "“Cá mùa nước nổi béo dữ lắm!”"], [.85, "“Thêm bông cho vàng nồi.”"], [1, "“Thơm quá trời thơm!”"]],
};
function pickStove() {
  const st = (snap.stoves || []).filter((s) => s.state !== "idle");
  if (!st.length) return null;
  const P = snap.player && snap.player.pos;
  if (P) st.sort((a, b) => Math.hypot(a.pos[0] - P[0], a.pos[1] - P[1]) - Math.hypot(b.pos[0] - P[0], b.pos[1] - P[1]));
  return st[0];
}
function drawKitchen() {
  const on = phaseOf() === "quan" && !scr.cur && innerWidth > 1100;
  const st = on ? pickStove() : null;
  show("kitchen", !!st);
  if (!st) return;
  const menu = snap.menu || {}, id = st.dish.dish_id, D = dish(id), total = menu[id] ? menu[id].cook_s * TICK_HZ : 1;
  const p = st.state === "ready" ? 1 : Math.max(0, Math.min(1, 1 - st.cook_ticks_left / total)), t = performance.now() / 1000;
  setHTML("k-dish", "· " + esc(st.id + " — " + D.name));
  const lines = KITCHEN_LINES[D.style] || KITCHEN_LINES.pot;
  setHTML("k-line", st.state === "ready" ? `“${esc(D.name)} chín rồi Út ơi, bưng ra lẹ!”` : esc((lines.find(([u]) => p <= u) || lines[lines.length - 1])[1]));
  const g = kctx, W = kcv.width, H = kcv.height;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#3b2216"); bg.addColorStop(1, "#1a0e08");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(255,200,120,${.06 + .04 * Math.sin(t * 2 + i)})`; g.beginPath(); g.arc(60 + i * 120, 40, 30, 0, 7); g.fill(); }
  // bếp than
  const fx = W / 2, fy = H * .72, heat = st.state === "ready" ? .35 : .8 + .2 * Math.sin(t * 9);
  g.fillStyle = "#5a321e"; g.beginPath(); g.ellipse(fx, fy + 40, 230, 60, 0, 0, 7); g.fill();
  const em = g.createRadialGradient(fx, fy + 30, 10, fx, fy + 30, 200); em.addColorStop(0, `rgba(255,170,60,${heat})`); em.addColorStop(1, "rgba(255,60,10,0)");
  g.fillStyle = em; g.beginPath(); g.ellipse(fx, fy + 30, 210, 55, 0, 0, 7); g.fill();
  const flames = (n, y0, hgt) => { for (let i = 0; i < n; i++) { const x = fx - 150 + i * (300 / (n - 1)), hh = hgt * (.6 + .4 * Math.sin(t * 11 + i * 1.7));
    const fg = g.createLinearGradient(0, y0, 0, y0 - hh); fg.addColorStop(0, "rgba(255,120,20,.95)"); fg.addColorStop(1, "rgba(255,230,120,0)");
    g.fillStyle = fg; g.beginPath(); g.moveTo(x - 18, y0); g.quadraticCurveTo(x, y0 - hh * 1.1, x + 18, y0); g.fill(); } };
  if (D.style === "grill") {
    if (p < .9) flames(9, fy + 10, p > .15 ? 150 : 60);
    if (p > .15 && p < .65) { g.fillStyle = "#d9b45a"; for (let i = 0; i < 40; i++) g.fillRect(fx - 120 + (i * 37) % 240, fy - 80 + (i * 23) % 70, 30, 4); }
    g.strokeStyle = "#c9a36b"; g.lineWidth = 8; g.beginPath(); g.moveTo(fx, fy + 30); g.lineTo(fx, fy - 170); g.stroke();
    g.fillStyle = p > .65 ? (p > .9 ? "#f3e7d3" : "#2a1a12") : kind("ca_loc").color;
    g.beginPath(); g.ellipse(fx, fy - 100, 40, 70, 0, 0, 7); g.fill();
    if (p > .9) { g.fillStyle = "#3f7a3a"; g.beginPath(); g.ellipse(fx + 120, fy - 20, 90, 30, -.2, 0, 7); g.fill(); }
  } else if (D.style === "salad") {
    g.fillStyle = "#e9d2a8"; g.beginPath(); g.ellipse(fx, fy - 20, 170, 60, 0, 0, 7); g.fill();
    g.fillStyle = "#c79c64"; g.beginPath(); g.ellipse(fx, fy - 30, 150, 45, 0, 0, Math.PI); g.fill();
    const n = Math.floor(6 + p * 18);
    for (let i = 0; i < n; i++) { const a = i * 2.4 + (p > .55 ? t * 2 : 0); g.strokeStyle = i % 3 ? "#7fbf6a" : "#ff8fb1"; g.lineWidth = 7;
      g.beginPath(); g.moveTo(fx + Math.cos(a) * 90, fy - 40 + Math.sin(a) * 25); g.lineTo(fx + Math.cos(a) * 90 + 26, fy - 52 + Math.sin(a) * 25); g.stroke(); }
    if (p > .85) { g.fillStyle = "#c2853a"; for (let i = 0; i < 20; i++) g.fillRect(fx - 90 + (i * 41) % 180, fy - 60 + (i * 13) % 30, 7, 5); }
  } else {
    flames(7, fy + 10, 80);
    g.fillStyle = "#7a4a2e"; g.beginPath(); g.ellipse(fx, fy - 40, 170, 90, 0, 0, Math.PI); g.lineTo(fx - 170, fy - 40); g.fill();
    g.fillStyle = "#a0603a"; g.beginPath(); g.ellipse(fx, fy - 40, 175, 42, 0, 0, 7); g.fill();
    g.fillStyle = p < .35 ? "#c8b37a" : "#d68b3c"; g.beginPath(); g.ellipse(fx, fy - 42, 155, 32, 0, 0, 7); g.fill();
    if (p > .1) for (let i = 0; i < 8; i++) { const bx = fx - 120 + (i * 53) % 240, by = fy - 45 + Math.sin(t * 6 + i) * 6; g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, 6 + (i % 3) * 3, 0, 7); g.stroke(); }
    if (p > .35) { const nf = p > .6 ? 3 : Math.ceil((p - .35) / .083); for (let i = 0; i < nf; i++) { g.fillStyle = kind("ca_linh").color; g.beginPath(); g.ellipse(fx - 70 + i * 70, fy - 46, 34, 11, .2, 0, 7); g.fill(); } }
    if (p > .6) { g.fillStyle = "#ffd54f"; for (let i = 0; i < 14; i++) { g.beginPath(); g.arc(fx - 110 + (i * 31) % 220, fy - 48 + (i % 3) * 6, 7, 0, 7); g.fill(); } }
    if (p > .85) for (let i = 0; i < 5; i++) { g.strokeStyle = `rgba(255,255,255,${.25 + .15 * Math.sin(t * 3 + i)})`; g.lineWidth = 6; g.beginPath(); const x = fx - 100 + i * 50; g.moveTo(x, fy - 90); g.bezierCurveTo(x - 25, fy - 140, x + 25, fy - 170, x, fy - 220 - (t * 40 + i * 30) % 30); g.stroke(); }
  }
  // đôi tay Út Sen (áo bà ba nâu)
  g.fillStyle = "#5b3420"; g.beginPath(); g.ellipse(70, H + 20, 90, 70, -.5, 0, 7); g.ellipse(W - 70, H + 20, 90, 70, .5, 0, 7); g.fill();
  g.fillStyle = "#e0b48a"; g.beginPath(); g.ellipse(140, H - 40, 34, 26, -.6, 0, 7); g.ellipse(W - 140, H - 40, 34, 26, .6, 0, 7); g.fill();
  // tiến độ
  g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(20, 20, W - 40, 22); g.fillStyle = st.state === "ready" ? "#7ad97a" : "#ffb347"; g.fillRect(20, 20, (W - 40) * p, 22);
  g.font = '800 30px "Be Vietnam Pro","Segoe UI",system-ui'; g.fillStyle = "#fff7ec"; g.textAlign = "right"; g.textBaseline = "top";
  g.fillText(st.state === "ready" ? "Chín rồi!" : "còn " + Math.ceil(st.cook_ticks_left / TICK_HZ) + " s", W - 24, 50);
}

// ================= vòng vẽ =================
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#120c09"; ctx.fillRect(0, 0, w, h);
  if (!snap) { label(offline ? "Không kết nối được máy chủ…" : "Đang kết nối phiên chơi…", w / 2, h / 2, 22); return; }
  const ph = phaseOf();
  if (ph === "quan") drawQuan(w, h); else if (ph === "shop") drawShopBg(w, h); else drawGather(w, h);
  drawParticles();
  updateHUD(); drawKitchen(); syncScreens();
  if (offline) label("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 60, 20, "#ffb3ab");
  if (snap.error) label("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 90, 20, "#ffb3ab");
}
resetClient();
if (params.get("menu") !== "0") showScreen("menu", { fresh: true });
poll();
requestAnimationFrame(frame);
</script>
