<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Nhóm 456 (Sáng Tạo Miền Tây)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1218; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .top-btn {
    position: absolute; top: 12px; z-index: 10;
    background: rgba(16, 26, 36, 0.75); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #e8eef2; border-radius: 20px; padding: 6px 14px; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s;
  }
  .top-btn:hover { background: rgba(30, 48, 68, 0.9); border-color: #4fc3f7; }
  #sound-btn { right: 14px; }
  #contrast-btn { right: 160px; }
  /* High contrast mode */
  body.high-contrast { background: #000 !important; color: #fff !important; }
  body.high-contrast .top-btn { background: #000; border: 2px solid #fff; color: #fff; font-weight: bold; }
</style>
</head>
<body>
<button id="contrast-btn" class="top-btn">👁 Tương phản cao: Tắt (H)</button>
<button id="sound-btn" class="top-btn">🔊 Âm thanh: Bật</button>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — Phiên bản Sáng tạo Nhóm 456 (TV4: Presceltooo)
 * - Đồ họa Canvas 2D mượt mà với hiệu ứng hạt (khói bếp, bọt khí lặn, sóng nước).
 * - Bộ âm thanh procedural (Web Audio API) zero-dependency: splash, cooking ready, coin reward.
 * - Hỗ trợ Chế độ Tương phản Cao (High Contrast Mode - Accessibility).
 * - Hệ thống 3 Cảnh báo trực quan chữ/icon (Thủy quái đến gần, Oxy cạn kiệt, Khách sắp giận).
 * - Hiển thị Cá Sấu Năm Chèo (M1, M2), trạng thái Pause và Ngày/Độ tươi.
 * - Hoàn toàn không can thiệp hay ảnh hưởng tới chế độ headless (Test Contract giữ nguyên).
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- Chế độ Tương phản cao (High Contrast) ----------
let highContrast = false;
const contrastBtn = document.getElementById("contrast-btn");
function toggleHighContrast() {
  highContrast = !highContrast;
  document.body.classList.toggle("high-contrast", highContrast);
  contrastBtn.innerText = highContrast ? "👁 Tương phản cao: BẬT (H)" : "👁 Tương phản cao: Tắt (H)";
}
contrastBtn.addEventListener("click", toggleHighContrast);

// ---------- Âm thanh Procedural Web Audio API ----------
let audioCtx = null;
let soundEnabled = true;
const soundBtn = document.getElementById("sound-btn");

function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

soundBtn.addEventListener("click", () => {
  initAudio();
  soundEnabled = !soundEnabled;
  soundBtn.innerText = soundEnabled ? "🔊 Âm thanh: Bật" : "🔇 Âm thanh: Tắt";
});

function playTone(freq, type, duration, gainVal = 0.1) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playSplashSound() {
  if (!soundEnabled) return;
  initAudio();
  playTone(180, "sine", 0.25, 0.15);
}

function playReadySound() {
  if (!soundEnabled) return;
  initAudio();
  playTone(587.33, "triangle", 0.35, 0.12); // D5
  setTimeout(() => playTone(880, "sine", 0.4, 0.15), 120); // A5
}

function playCoinSound() {
  if (!soundEnabled) return;
  initAudio();
  playTone(987.77, "sine", 0.2, 0.15); // B5
  setTimeout(() => playTone(1318.51, "sine", 0.3, 0.18), 100); // E6
}

// Theo dõi sự kiện mới từ snap để kích hoạt hiệu ứng & âm thanh
let lastEventCount = 0;
function processNewEvents(events) {
  if (!events || events.length === 0) return;
  if (lastEventCount > events.length) lastEventCount = 0;
  for (let i = lastEventCount; i < events.length; i++) {
    const ev = events[i];
    if (ev.name === "dish_ready") {
      playReadySound();
    } else if (ev.name === "paid") {
      playCoinSound();
    } else if (ev.name === "dive" || ev.name === "surface") {
      playSplashSound();
    }
  }
  lastEventCount = events.length;
}

// ---------- Hệ thống Hạt Hiệu ứng (Particles) ----------
const particles = [];
function addBubble(x, y) {
  particles.push({
    type: "bubble", x, y,
    vx: (Math.random() - 0.5) * 0.4,
    vy: -(0.5 + Math.random() * 0.8),
    r: 2 + Math.random() * 3.5,
    life: 1, decay: 0.015 + Math.random() * 0.01
  });
}

function addSmoke(x, y) {
  particles.push({
    type: "smoke", x, y,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -(0.6 + Math.random() * 0.6),
    r: 3 + Math.random() * 4,
    life: 1, decay: 0.012 + Math.random() * 0.008
  });
}

function updateAndDrawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.save();
    if (p.type === "bubble") {
      ctx.strokeStyle = `rgba(255, 255, 255, ${p.life * 0.6})`;
      ctx.fillStyle = `rgba(180, 235, 255, ${p.life * 0.25})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (p.type === "smoke") {
      ctx.fillStyle = `rgba(220, 220, 225, ${p.life * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (2 - p.life), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput(extra = {}) {
  const phase = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase === "quan") dy = -dy;                               // quan: lên (bắc) = z dương
  return Object.assign({
    move: [dx, dy],
    interact: down.has("interact"),
    catch: down.has("catch"),
    pause: down.has("pause"),
    shop_done: down.has("shop_done")
  }, extra);
}
function sendOneShot(extra) {
  queue.push(JSON.stringify(currentInput(extra)));
  flush();
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  initAudio();
  const k = keyName(e);
  const phase = snap ? (snap.phase || snap.mode) : "gather";
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") {
    if (phase === "shop") down.add("shop_done");
    else down.add("interact");
  }
  else if (k === "enter" && phase === "shop") { down.add("shop_done"); }
  else if (k === "1" && phase === "shop") { sendOneShot({ buy: "oxygen" }); return; }
  else if (k === "2" && phase === "shop") { sendOneShot({ buy: "hp" }); return; }
  else if (k === "p" || k === "escape") { down.add("pause"); }
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "h") { toggleHighContrast(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") { down.delete("interact"); down.delete("shop_done"); }
  else if (k === "enter") down.delete("shop_done");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    if (snap && snap.events) processNewEvents(snap.events);
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = {
  ca_loc: "#7c9a52", ca_linh: "#82b1ff", ca_keo: "#d9a066",
  bong_dien_dien: "#ffd54f", bong_sung: "#f06292", keo_neo: "#aed581"
};
const KIND_NAME = {
  ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo",
  bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo"
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
// v1.2 (TICKET-03): giỏ / kho là mảng cá thể {id, kind, fresh}; vẫn đọc được bản đếm cũ.
const itemKind = (it) => (typeof it === "string" ? it : it.kind);
const spoilBelow = () => (snap && snap.freshness && snap.freshness.spoiled_below) || 30;
const isSpoiled = (it) => typeof it === "object" && it.fresh < spoilBelow();
function freshColor(f) { return f < spoilBelow() ? "#ef5350" : f < 60 ? "#ffb74d" : "#66bb6a"; }
function freshSummary(list) {
  // "cá lóc×2 (tươi 98%, ươn 1)" theo kind; nhận mảng cá thể hoặc object đếm cũ
  if (!list) return "";
  if (!Array.isArray(list)) return Object.keys(list).map((k) => (KIND_NAME[k] || k) + "×" + list[k]).join(", ");
  const by = {};
  list.forEach((it) => { const k = itemKind(it); (by[k] = by[k] || []).push(it); });
  return Object.keys(by).sort().map((k) => {
    const xs = by[k], fr = xs.filter((x) => typeof x === "object");
    if (!fr.length) return (KIND_NAME[k] || k) + "×" + xs.length;
    const avg = Math.round(fr.reduce((a, x) => a + x.fresh, 0) / fr.length);
    const bad = fr.filter(isSpoiled).length;
    return (KIND_NAME[k] || k) + "×" + xs.length + " (tươi " + avg + "%" + (bad ? ", ươn " + bad : "") + ")";
  }).join(", ");
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || "normal") + " " + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 4) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.fillStyle = color;
  const fw = Math.max(0, Math.min(1, frac)) * w;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, fw, h, 4) : ctx.rect(x, y, fw, h); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.3)";
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 4) : ctx.rect(x, y, w, h); ctx.stroke();
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center", weight: "bold" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 50 ? s.slice(0, 47) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 16, h - 60 - (ev.length - 1 - i) * 16, { size: 11, align: "right", color: "rgba(232,238,242,.7)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 36, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 58, { align: "center", color: "#ff8a80", size: 15 });
  
  // Pause overlay
  if (snap.paused) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = highContrast ? "#ffff00" : "#4fc3f7";
    ctx.font = "bold 32px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("⏸ ĐANG TẠM DỪNG (PAUSED)", w / 2, h / 2 - 10);
    ctx.fillStyle = "#fff";
    ctx.font = "16px system-ui, sans-serif";
    ctx.fillText("Bấm P hoặc ESC để tiếp tục", w / 2, h / 2 + 30);
  }

  // 3 Cảnh báo trực quan (Warning Banners chữ & icon - Accessibility)
  const warnings = [];
  const p = snap.player;
  const tickMod = Math.floor(Date.now() / 300) % 2 === 0;

  // 1. Cảnh báo Oxy cạn kiệt (< 25%)
  if (snap.mode === "gather" && p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    if (p.oxygen_ticks < p.oxygen_max_ticks * 0.25) {
      warnings.push({ text: "🫧 OXY CẠN KIỆT! HÃY NỔI LÊN BẾN NGAY!", color: "#ff1744" });
    }
  }

  // 2. Cảnh báo Thủy quái Cá Sấu gần thợ lặn
  if (snap.mode === "gather" && p && snap.monsters && snap.monsters.length) {
    const pPos = p.pos || [0, 0];
    const near = snap.monsters.some(m => {
      const dx = m.pos[0] - pPos[0], dy = m.pos[1] - pPos[1];
      return Math.sqrt(dx * dx + dy * dy) <= 12; // Trong tầm 12m
    });
    if (near) {
      warnings.push({ text: "⚠️ NGUY HIỂM: THỦY QUÁI CÁ SẤU ĐANG Ở GẦN!", color: "#ff9100" });
    }
  }

  // 3. Cảnh báo Khách sắp giận (kiên nhẫn < 25%)
  if (snap.mode === "quan" && snap.customers && snap.customers.length) {
    const patMax = (snap.meta && snap.meta.patience_s ? snap.meta.patience_s : 60) * 60;
    const angry = snap.customers.some(c => c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left < patMax * 0.25);
    if (angry) {
      warnings.push({ text: "⏳ CẢNH BÁO: KHÁCH HÀNG SẮP BỎ VỀ VÌ CHỜ LÂU!", color: "#ff5252" });
    }
  }

  // Vẽ các banner cảnh báo nhấp nháy trên đỉnh màn hình
  warnings.forEach((warn, idx) => {
    const warnY = 70 + idx * 30;
    ctx.save();
    ctx.fillStyle = tickMod ? warn.color : "rgba(0, 0, 0, 0.85)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(w / 2 - 240, warnY, 480, 26, 6) : ctx.rect(w / 2 - 240, warnY, 480, 26);
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : warn.color; ctx.lineWidth = 2; ctx.stroke();
    text(warn.text, w / 2, warnY + 18, {
      align: "center", size: 12, weight: "bold",
      color: tickMod ? "#ffffff" : (highContrast ? "#ffff00" : warn.color)
    });
    ctx.restore();
  });

  if (snap.finished) {
    ctx.fillStyle = highContrast ? "#000000" : "rgba(10,16,24,.85)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(w / 2 - 210, h / 2 - 60, 420, 120, 12) : ctx.rect(w / 2 - 210, h / 2 - 60, 420, 120);
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffff00" : "#4fc3f7"; ctx.lineWidth = highContrast ? 3 : 1.5; ctx.stroke();
    text("🏁 Buổi " + (snap.mode === "gather" ? "sáng (lặn hái)" : "tối (mở quán)") + " kết thúc!", w / 2, h / 2 - 20, { align: "center", size: 19, weight: "bold", color: "#fff" });
    text("Lý do: " + (snap.reason || ""), w / 2, h / 2 + 8, { align: "center", size: 14, color: highContrast ? "#ffff00" : "#b0bec5" });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 36, { align: "center", size: 13, color: highContrast ? "#ffffff" : "#81d4fa" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
let waveOffset = 0;
function drawGather(w, h) {
  waveOffset += 0.03;
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Trời
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#b3e5fc");
  skyGrad.addColorStop(1, "#e1f5fe");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, top, w, SKY * s);

  // Nước sông sâu
  const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  waterGrad.addColorStop(0, "#29b6f6");
  waterGrad.addColorStop(0.3, "#0288d1");
  waterGrad.addColorStop(1, "#031c36");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Sóng nước nhấp nhô trên mặt
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = sx(0); x <= sx(X); x += 6) {
    const waveY = oy + Math.sin((x * 0.05) + waveOffset) * 2.5;
    if (x === sx(0)) ctx.moveTo(x, waveY); else ctx.lineTo(x, waveY);
  }
  ctx.stroke();

  // Vạch độ sâu mờ
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 6, sy(d) - 3, { size: 10, color: "rgba(255,255,255,.45)" });
  }

  // Bến thuyền miền Tây
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#6d4c41"; ctx.fillRect(sx(dp[0] - 1.6), sy(-0.8), 3.2 * s, 1.0 * s);
  ctx.fillStyle = "#c62828";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 1.9), sy(-0.8)); ctx.lineTo(sx(dp[0]), sy(-2.5)); ctx.lineTo(sx(dp[0] + 1.9), sy(-0.8));
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 238, 88, 0.7)"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("⚓ Bến Cập (E)", sx(dp[0]), sy(-2.9), { size: 12, align: "center", color: "#4e342e", weight: "bold" });

  // Cụm rau thủy sinh
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 1.0 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#1a237e" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.2 * s, { size: 10, align: "center", color: "#fff" });
  });

  // Đàn cá bơi lội
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = highContrast ? "#00ffff" : kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 1.0 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    // Vây đuôi
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.5 * s, -0.45 * s); ctx.lineTo(-1.5 * s, 0.45 * s); ctx.fill();
    // Mắt cá
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0.5 * s, -0.15 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(0.55 * s, -0.15 * s, 0.06 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.8 * s, { size: 10, align: "center", color: highContrast ? "#ffff00" : "rgba(255,255,255,.85)", weight: "bold" });
  });

  // Thủy quái: Cá Sấu Năm Chèo (M1, M2)
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    const isChase = m.state === "chase";
    ctx.save();
    ctx.translate(mx, my);
    // Vẽ thân cá sấu vảy gai
    ctx.fillStyle = highContrast ? (isChase ? "#ff0000" : "#ff5500") : (isChase ? "#b71c1c" : "#2e7d32");
    ctx.beginPath();
    ctx.ellipse(0, 0, 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : (isChase ? "#ff5252" : "#81c784");
    ctx.lineWidth = highContrast ? 2.5 : 1.5; ctx.stroke();
    // Mõm cá sấu
    ctx.beginPath();
    ctx.moveTo(1.2 * s, -0.3 * s); ctx.lineTo(2.2 * s, 0); ctx.lineTo(1.2 * s, 0.3 * s);
    ctx.fill(); ctx.stroke();
    // Mắt đỏ quái vật
    ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(0.8 * s, -0.25 * s, 0.15 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d50000"; ctx.beginPath(); ctx.arc(0.85 * s, -0.25 * s, 0.08 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    text("🐊 " + m.id + (isChase ? " (DÍ!)" : ""), mx, my - 1.0 * s, {
      size: 11, align: "center", weight: "bold",
      color: isChase ? "#ff1744" : (highContrast ? "#ffff00" : "#a5d6a7")
    });
  });

  // Người chơi Út Sen
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (underwater && Math.random() < 0.25) addBubble(px + (Math.random() - 0.5) * 8, py);
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff6f00"; ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * s, py + Math.sin(a) * s); ctx.stroke();
    }
  }

  // HUD trên màn hình
  text("⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, weight: "bold", color: "#fff" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(120, 16, 220, 20, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy: " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "❤️" : "🖤";
    text(hs, 355, 33, { size: 18 });
  }
  if (p && p.pos) text(`Vị trí: x=${p.pos[0].toFixed(1)}m | d=${p.pos[1].toFixed(1)}m`, 16, 56, { size: 12, color: "#b0bec5" });
  if (p && p.catch_cd_ticks > 0) text("⏳ Bắt cá cd: " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 180, 56, { size: 12, color: "#ffb74d" });

  // Giỏ đồ đáy màn hình
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(32, (w - 260) / cap - 4), y0 = h - bottom + 6;
    for (let i = 0; i < cap; i++) {
      const x0 = 16 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x0, y0, sz, sz, 4) : ctx.rect(x0, y0, sz, sz); ctx.fill();
      const it = snap.hold[i];
      if (it) {
        ctx.globalAlpha = isSpoiled(it) ? 0.4 : 1;
        ctx.fillStyle = kc(itemKind(it));
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x0 + 3, y0 + 3, sz - 6, sz - 6, 3) : ctx.rect(x0 + 3, y0 + 3, sz - 6, sz - 6); ctx.fill();
        ctx.globalAlpha = 1;
        if (typeof it === "object") {  // thanh độ tươi + dấu ươn
          ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x0 + 2, y0 + sz - 4, (sz - 4) * Math.max(0, it.fresh) / 100, 3);
          if (isSpoiled(it)) text("✕", x0 + sz / 2, y0 + sz / 2 + 5, { size: 14, align: "center", color: "#ff5252", weight: "bold" });
        }
      }
    }
    text("🧺 Giỏ lặn: " + snap.hold.length + "/" + cap + "  [" + freshSummary(snap.hold) + "]", 16, y0 + sz + 15, { size: 12, color: "#eceff1", weight: "bold" });
  }
  text("WASD / Phím mũi tên: Di chuyển · E: Hái rau/Cập bến · Space: Bắt cá · R: Chơi lại", w - 16, h - 14, { size: 12, align: "right", color: "#b0bec5" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 44;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Sàn thuyền gỗ miền Tây
  ctx.fillStyle = "#8d6e63"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#4e342e"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Đường kẻ ván sàn gỗ
  ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1;
  for (let z = 1; z < Z; z++) {
    ctx.beginPath(); ctx.moveTo(sx(0), sy(z)); ctx.lineTo(sx(X), sy(z)); ctx.stroke();
  }

  // Bếp nấu & hiệu ứng khói bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#f57c00" : st.state === "ready" ? "#43a047" : "#546e7a";
    const stX = sx(st.pos[0]), stY = sy(st.pos[1]);
    if (st.state === "cooking" && Math.random() < 0.3) addSmoke(stX + (Math.random() - 0.5) * 8, stY);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(stX - 0.8 * s, stY - 0.8 * s, 1.6 * s, 1.6 * s, 6) : ctx.rect(stX - 0.8 * s, stY - 0.8 * s, 1.6 * s, 1.6 * s);
    ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    text("🍳 " + st.id, stX, stY + 4, { size: 12, align: "center", color: "#fff", weight: "bold" });
    if (st.dish) {
      const dishLabel = typeof st.dish === "string" ? st.dish : (st.dish.dish_id || "món");
      text(dishLabel, stX, stY - 1.0 * s, { size: 11, align: "center", color: "#fff", weight: "bold" });
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      text("🔥 " + Math.ceil(st.cook_ticks_left / 60) + "s", stX, stY + 1.35 * s, { size: 11, align: "center", color: "#ffe082", weight: "bold" });
    }
  });

  // Bàn ăn & thực khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const tbX = sx(tb.pos[0]), tbY = sy(tb.pos[1]);
    ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(tbX, tbY, 0.95 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 2; ctx.stroke();
    text(tb.id, tbX, tbY + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = tbX, cy = tbY - 1.55 * s;
      ctx.fillStyle = c.state === "eating" ? "#66bb6a" : "#ffa726";
      ctx.beginPath(); ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      text(c.state === "eating" ? "😋" : "🍲 " + (c.dish_id || "?"), cx, cy - 0.8 * s, { size: 11, align: "center", color: "#fff", weight: "bold" });
      if (c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        const col = frac > 0.5 ? "#66bb6a" : frac > 0.25 ? "#ffa726" : "#ef5350";
        bar(cx - 0.9 * s, cy + 0.75 * s, 1.8 * s, 6, frac, col);
      }
    }
  });

  // Người chơi phục vụ
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff6f00"; ctx.beginPath(); ctx.arc(px, py, 0.55 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🥘 " + hand, px, py - 0.9 * s, { size: 12, align: "center", color: "#ffe082", weight: "bold" });
    }
  }

  // HUD quán ăn
  text("⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, weight: "bold" });
  text(`💰 Doanh thu: ${snap.money ?? 0}k · ⭐ Uy tín: ${(snap.reputation ?? 0).toFixed(1)} · 🏆 Điểm: ${snap.score ?? 0}`, 120, 31, { size: 16, color: "#ffe082", weight: "bold" });
  const stock = freshSummary(snap.stock);
  text("📦 Nguyên liệu trong kho: " + (stock || "(trống)"), 16, 56, { size: 13, color: "#cfd8dc" });
  text("WASD / Mũi tên: Di chuyển · E: Tương tác (Nấu/Bưng/Phục vụ) · R: Chơi lại", w - 16, h - 14, { size: 12, align: "right", color: "#b0bec5" });
}

function drawShop(w, h) {
  ctx.fillStyle = "#16202a";
  ctx.fillRect(0, 0, w, h);
  const ups = (snap.shop_meta && snap.shop_meta.upgrades) || {};
  const cur = snap.upgrades || {};
  const cx = w / 2, top = 80;
  text(`🛒 CHỢ NÂNG CẤP — NGÀY ${snap.day || 1}`, cx, top, { align: "center", size: 26, weight: "bold", color: "#ffd54f" });
  text(`⏱ Tự đóng sau: ${fmtTime(snap.time_left_ticks || 0)}  ·  💰 Tiền: ${snap.money ?? 0}k  ·  ⭐ Uy tín: ${(snap.reputation ?? 0).toFixed(1)}  ·  🏆 Điểm: ${snap.score ?? 0}`, cx, top + 36, { align: "center", size: 16, color: "#e8eef2" });

  const cards = [
    { key: "1", id: "oxygen", title: "🫧 Bình Oxy", desc: "Tăng oxy tối đa từ Ngày kế" },
    { key: "2", id: "hp", title: "🛟 Áo Phao (Máu)", desc: "Tăng Máu tối đa từ Ngày kế" }
  ];
  cards.forEach((c, idx) => {
    const lv = cur[c.id] || 0;
    const list = ups[c.id] || [];
    const nxt = list.find((e) => e.level === lv + 1);
    const bx = cx - 260 + idx * 270, by = top + 75, bw = 250, bh = 150;
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 12) : ctx.rect(bx, by, bw, bh); ctx.fill();
    ctx.strokeStyle = nxt && (snap.money >= nxt.price) ? "#66bb6a" : "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2; ctx.stroke();
    text(`[${c.key}] ${c.title}`, bx + 16, by + 34, { size: 18, weight: "bold", color: "#fff" });
    text(`Cấp hiện tại: ${lv}/${list.length}`, bx + 16, by + 64, { size: 14, color: "#b0bec5" });
    text(c.desc, bx + 16, by + 90, { size: 12, color: "#90a4ae" });
    text(nxt ? `Giá cấp ${nxt.level}: ${nxt.price}k (nhấn ${c.key})` : "✅ Đã tối đa", bx + 16, by + 125, { size: 14, weight: "bold", color: nxt ? "#ffe082" : "#66bb6a" });
  });

  text("Nhấn [Enter] hoặc [E] để đóng Shop sang Ngày mới · [P/Esc] Tạm dừng · [R] Chơi lại", cx, top + 275, { align: "center", size: 15, color: "#81d4fa", weight: "bold" });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#0c1218"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h);
    else if (phase === "shop") drawShop(w, h);
    else drawGather(w, h);
    updateAndDrawParticles();
    eventLog(w, h);
    if (snap.state === "paused") {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, w, h);
      text("⏸ TẠM DỪNG", w / 2, h / 2 - 12, { align: "center", size: 28, weight: "bold", color: "#ffd54f" });
      text("Nhấn P hoặc Esc để tiếp tục", w / 2, h / 2 + 24, { align: "center", size: 16, color: "#e8eef2" });
    }
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang kết nối phiên chơi…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
